---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: remote-net
  annotations:
    net.cidr: "192.168.200.0/24"
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "br-remote",
      "ipam": {
        "type": "static",
        "ranges": [[{ "subnet": "192.168.200.0/24" }]],
        "routes": []
      }
    }
---
