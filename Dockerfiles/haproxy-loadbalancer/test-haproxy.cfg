global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend http_in
    bind *:80
    default_backend web_servers

backend web_servers
    balance roundrobin
    server ws1 172.17.0.3:80 check
    server ws2 172.17.0.4:80 check

